[project]
name = "show-butler"
version = "0.1.0"
description = "Personal app that tracks standup comedy shows, alerts you weekly, prevents double-booking, and helps you book and add shows to Google Calendar"
readme = "README.md"
authors = [
    { name = "georgeliu1998", email = "12277063+georgeliu1998@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
    "google-cloud-firestore>=2.28.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-google-genai>=4.2.7",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "selectolax>=0.4.10",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/show_butler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort (import sorting)
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
